run:
  prefix: 20260612_all_scenarios
  name:
    # Mid DH – Mid Supply
    - NoPTES_MidSupplyTemperature_MidDH_init
    - NoPTES_MidSupplyTemperature_MidDH
    # - MidSupplyTemperature_MidDH_noboost
    - MidSupplyTemperature_MidDH_hpboost_nocooling
    - MidSupplyTemperature_MidDH_rhboost
    - MidSupplyTemperature_MidDH_hpboost_10Cbottom
    - MidSupplyTemperature_MidDH_freeboost
    - MidSupplyTemperature_MidDH_freecap
    # - MidSupplyTemperature_MidDH_freeboost_freescale
    # Low Supply
    - NoPTES_LowSupplyTemperature_MidDH_init
    - NoPTES_LowSupplyTemperature_MidDH
    # - LowSupplyTemperature_MidDH_noboost
    - LowSupplyTemperature_MidDH_hpboost_nocooling
    - LowSupplyTemperature_MidDH_rhboost
    - LowSupplyTemperature_MidDH_hpboost_10Cbottom
    - LowSupplyTemperature_MidDH_freeboost
    - LowSupplyTemperature_MidDH_freecap
    # - LowSupplyTemperature_MidDH_freeboost_freecap
    # High Supply
    - NoPTES_HighSupplyTemperature_MidDH_init
    - NoPTES_HighSupplyTemperature_MidDH
    # - HighSupplyTemperature_MidDH_noboost
    - HighSupplyTemperature_MidDH_hpboost_nocooling
    - HighSupplyTemperature_MidDH_rhboost
    - HighSupplyTemperature_MidDH_hpboost_10Cbottom
    - HighSupplyTemperature_MidDH_freeboost
    - HighSupplyTemperature_MidDH_freecap
    # - HighSupplyTemperature_MidDH_noboost_noscale
    # Top Temperature Sensitivity (±5°C from 90°C baseline)
    - NoPTES_TopTSens_85_init
    - NoPTES_TopTSens_85
    - TopTSens_85_rhboost
    - TopTSens_85_hpboost_nocooling
    - TopTSens_85_hpboost_10Cbottom
    - TopTSens_85_freeboost
    - TopTSens_85_freecap
    - NoPTES_TopTSens_95_init
    - NoPTES_TopTSens_95
    - TopTSens_95_rhboost
    - TopTSens_95_hpboost_nocooling
    - TopTSens_95_hpboost_10Cbottom
    - TopTSens_95_freeboost
    - TopTSens_95_freecap
    # DH potential sensitivities
    # - NoPTES_MidSupplyTemperature_LowDH_init
    # - NoPTES_MidSupplyTemperature_LowDH
    # - MidSupplyTemperature_LowDH_rhboost
    # - NoPTES_MidSupplyTemperature_HighDH_init
    # - NoPTES_MidSupplyTemperature_HighDH
    # - MidSupplyTemperature_HighDH_rhboost
    # CAPEX sensitivities
    # - MidSupplyTemperature_MidDH_rhboost_0.01CAPEX
    # - MidSupplyTemperature_MidDH_rhboost_0.25CAPEX
    # - MidSupplyTemperature_MidDH_rhboost_0.5CAPEX
    # - MidSupplyTemperature_MidDH_rhboost_0.75CAPEX
    # - MidSupplyTemperature_MidDH_rhboost_1.25CAPEX
    # - MidSupplyTemperature_MidDH_rhboost_1.5CAPEX
    # - MidSupplyTemperature_MidDH_rhboost_1.75CAPEX
    # - MidSupplyTemperature_MidDH_rhboost_2CAPEX
    # H2 variant
    # - NoPTES_MidSupplyTemperature_MidDH_H2_init
    # - NoPTES_MidSupplyTemperature_MidDH_H2
    # - MidSupplyTemperature_MidDH_H2_rhboost
  scenarios:
    enable: true
    manual_file: config/scenarios.sysgf.yaml
    file: config/scenarios.automated.yaml
  shared_resources:
    policy: base #stops recalculating
    exclude:
    - existing_heating.csv   # specify files which should not be shared between scenarios
    - costs
    - retrieve_cost   # This is necessary to save retrieve_cost_data_{year}.log in the correct folder
    - industry_sector_ratios
    - build_industry_sector_ratios   # This is necessary to save build_industry_sector_ratios_data.log in the correct folder
    - modify_existing_heating

foresight: myopic

scenario:
  ll:
  - vopt
  clusters:
  - 49 #current options: 27, 49
  opts:
  - ''
  sector_opts:
  - none
  planning_horizons:
  # - 2020
  # - 2025
  # - 2030
  # - 2035
  # - 2040
  - 2045

fix_foreign_investments:
  enable: true
  reference_scenario: NoPTES_MidSupplyTemperature_MidDH
  nom_min: true
  nom_max: true
  lines_only: false
  unfix_virtual_components: true
  slack: 0

clustering:
  focus_weights:
    'DE': 0.6124
    'AT': 0.0204
    'BE': 0.0204
    'CH': 0.0204
    'CZ': 0.0204
    'DK': 0.0408
    'FR': 0.0204
    'GB': 0.0408
    'LU': 0.0204
    'NL': 0.0204
    'NO': 0.0204
    'PL': 0.0204
    'SE': 0.0204
    'ES': 0.0408
    'IT': 0.0612
  temporal:
    resolution_sector: 3H

co2_budget:
  2045: 0.00

adjustments:
  electricity: false
  sector:
    absolute:
      Store:
        urban central water pits:
          standing_loss: 0.000078
        urban central water tanks:
          standing_loss: 0.000077
    factor:
      Link:
        urban central air heat pump:
          marginal_cost: 1.8
        urban central geothermal heat pump:
          capital_cost: 0.66
          marginal_cost: 2.02
        urban central river_water heat pump:
          capital_cost: 0.86
          marginal_cost: 1.8
        urban central sea_water heat pump:
          capital_cost: 0.86
          marginal_cost: 1.8
        urban central electrolysis excess heat pump:
          capital_cost: 0.76
          marginal_cost: 1.8
        urban central ptes heat pump:
          capital_cost: 0.66
          marginal_cost: 1.8
electricity:
  renewable_carriers: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, hydro]
  
sector:
  chp:
    enable: true
  district_heating:
    potential:
      DE: 0.4
      default: 0.4
    progress:
      2045: 1.0
    supply_temperature_approximation:
      max_forward_temperature_baseyear:
        FR: 110
        DK: 75
        DE: 124
        CZ: 130
        FI: 115
        PL: 130
        SE: 102
        IT: 90
      min_forward_temperature_baseyear:
        DE: 82
      return_temperature_baseyear:
        DE: 60
      lower_threshold_ambient_temperature: 0
      upper_threshold_ambient_temperature: 10
      rolling_window_ambient_temperature: 72
      relative_annual_temperature_reduction: 0.01
    subnodes:
      enable: true
      nlargest: 40
      census_areas:
        enable: true
        min_district_heating_share: 0.01
        processing:
          min_area: [10000, 100000, 0, 1000000]
          buffer_factor: [0.01, 0.05, 0.05, 0]
          buffer_absolute: 5
      limit_ptes_potential:
        enable: true
        limit_mother_nodes: true
        limit_foreign_nodes: true
        excluder_resolution: 10
        osm_landcover_codes: [21, 23, 32, 33]
        max_groundwater_depth: -10
        min_area: 25000
        default_capacity: 4500
    limited_heat_sources:
      geothermal:
        ignore_missing_regions: true
        requires_generator: true
      electrolysis excess:
        constant_temperature_celsius: 70
        ignore_missing_regions: false
        requires_generator: false
      river_water:
        constant_temperature_celsius: false
        requires_generator: true
    ptes:
      enable: true
      dynamic_capacity: false
      scale_capacity: true
      booster_technologies: ["ptes"]
      discharger_temperature_boosting_required: true
      charger_temperature_boosting_required: false
      max_top_temperature: 90
      min_bottom_temperature: 35
      clip_network_temperature: true
    ttes:
      enable: true
    ates:
      enable: false
    dh_area_buffer: 5000
  tes: true
  tes_tau:
    decentral: 3
    central: 180
  heat_pump_sources:
    urban central:
    - air
    - electrolysis excess
    - geothermal
    - river_water
    - sea_water
    - ptes
    urban decentral:
    - air
    rural:
    - air
    - ground
  electrobiofuels: true

solving:
  runtime: 24h
  mem_mb: 180000
  constraints:
    CCL: false
    EQ: false
    BAU: false
    SAFE: false
    efuel_export_ban: false
    limits_capacity_max:
      Generator: null
      Link: null
    limits_capacity_min:
      Generator: null
      Link: null
    limits_volume_max:
      electrolysis: null
      h2_derivate_import: null
      h2_import: null      
  options:
    noisy_costs: true
    skip_iterations: true
    min_iterations: 1
    max_iterations: 1
    transmission_losses: 0
  solver_options:
    gurobi-default:
      Seed: 123
      BarConvTol: 1.e-6
      # FeasibilityTol: 1.e-6
      Crossover: 0
      AggFill: 0
      PreDual: 0
      GURO_PAR_BARDENSETHRESH: 200
      # NumericFocus: 3


plotting:
  # Technology grouping options (all enabled by default in plot_dh_systems.py)
  group_chp: false                   # Group all CHP technologies as "CHP"
  group_heat_pumps: false           # Group all heat pumps as "Heat Pumps"
  group_ashp_wshp: false            # Group all ASHP and WSHP technologies as "ASHP/WSHP" bypasses
  group_demands: true              # Group demands as "District Heating Demand"
  drop_losses: true
  subnodes_only: false                # Remove loss columns from plots
  aggregate_threshold_pct: 0.05
  balance_map:
    bus_carriers: null
  dual_comparison:
    enable: true
    scenario_A: NoPTES_LowSupplyTemperature_MidDH
    scenario_B: MidSupplyTemperature_MidDH_rhboost
  sensitivities:
    enable: false
    reference: MidSupplyTemperature_MidDH_rhboost
    runs: [
      MidSupplyTemperature_MidDH_rhboost_0.01CAPEX, 
      MidSupplyTemperature_MidDH_rhboost_0.25CAPEX, 
      MidSupplyTemperature_MidDH_rhboost_0.5CAPEX, 
      MidSupplyTemperature_MidDH_rhboost_0.75CAPEX, 
      MidSupplyTemperature_MidDH_rhboost_1.25CAPEX, 
      MidSupplyTemperature_MidDH_rhboost_1.5CAPEX, 
      MidSupplyTemperature_MidDH_rhboost_1.75CAPEX, 
      MidSupplyTemperature_MidDH_rhboost_2CAPEX
    ]
  scenario_tuples:
    # Original scenarios
    - ["NoPTES_LowSupplyTemperature", "LowSupplyTemperature_hpboost_nocooling"]
    - ["NoPTES_LowSupplyTemperature", "LowSupplyTemperature_rhboost"]
    - ["NoPTES_LowSupplyTemperature", "LowSupplyTemperature_hpboost_10Cbottom"]
    - ["NoPTES_LowSupplyTemperature", "LowSupplyTemperature_noboost"]
    - ["NoPTES_HighSupplyTemperature", "HighSupplyTemperature_hpboost_nocooling"]
    - ["NoPTES_HighSupplyTemperature", "HighSupplyTemperature_rhboost"]
    - ["NoPTES_HighSupplyTemperature", "HighSupplyTemperature_hpboost_10Cbottom"]
    - ["NoPTES_HighSupplyTemperature", "HighSupplyTemperature_noboost"]
    - ["NoPTES_LowDH_LowSupplyTemperature", "LowDH_LowSupplyTemperature_rhboost"]
    - ["NoPTES_HighDH_LowSupplyTemperature", "HighDH_LowSupplyTemperature_rhboost"]
    # Mid Supply Temperature scenarios with Mid DH
    - ["NoPTES_MidSupplyTemperature_MidDH", "MidSupplyTemperature_MidDH_hpboost_nocooling"]
    - ["NoPTES_MidSupplyTemperature_MidDH", "MidSupplyTemperature_MidDH_rhboost"]
    - ["NoPTES_MidSupplyTemperature_MidDH", "MidSupplyTemperature_MidDH_hpboost_10Cbottom"]
    - ["NoPTES_MidSupplyTemperature_MidDH", "MidSupplyTemperature_MidDH_noboost"]
    - ["MidSupplyTemperature_MidDH_hpboost_nocooling", "MidSupplyTemperature_MidDH_noboost"]
    - ["MidSupplyTemperature_MidDH_hpboost_nocooling", "MidSupplyTemperature_MidDH_rhboost"]
    - ["MidSupplyTemperature_MidDH_rhboost", "MidSupplyTemperature_MidDH_noboost"]
    # Low Supply Temperature scenarios with Mid DH
    - ["NoPTES_LowSupplyTemperature_MidDH", "LowSupplyTemperature_MidDH_hpboost_nocooling"]
    - ["NoPTES_LowSupplyTemperature_MidDH", "LowSupplyTemperature_MidDH_rhboost"]
    - ["NoPTES_LowSupplyTemperature_MidDH", "LowSupplyTemperature_MidDH_hpboost_10Cbottom"]
    - ["NoPTES_LowSupplyTemperature_MidDH", "LowSupplyTemperature_MidDH_noboost"]
    # High Supply Temperature scenarios with Mid DH
    - ["NoPTES_HighSupplyTemperature_MidDH", "HighSupplyTemperature_MidDH_hpboost_nocooling"]
    - ["NoPTES_HighSupplyTemperature_MidDH", "HighSupplyTemperature_MidDH_rhboost"]
    - ["NoPTES_HighSupplyTemperature_MidDH", "HighSupplyTemperature_MidDH_hpboost_10Cbottom"]
    - ["NoPTES_HighSupplyTemperature_MidDH", "HighSupplyTemperature_MidDH_noboost"]
    # Mid Supply Temperature with different DH potentials
    - ["NoPTES_MidSupplyTemperature_LowDH", "MidSupplyTemperature_LowDH_rhboost"]
    - ["NoPTES_MidSupplyTemperature_HighDH", "MidSupplyTemperature_HighDH_rhboost"]
    # Top Temperature Sensitivity (85°C / 95°C)
    - ["NoPTES_TopTSens_85", "TopTSens_85_rhboost"]
    - ["NoPTES_TopTSens_85", "TopTSens_85_hpboost_nocooling"]
    - ["NoPTES_TopTSens_85", "TopTSens_85_freeboost"]
    - ["NoPTES_TopTSens_85", "TopTSens_85_freecap"]
    - ["NoPTES_TopTSens_95", "TopTSens_95_rhboost"]
    - ["NoPTES_TopTSens_95", "TopTSens_95_hpboost_nocooling"]
    - ["NoPTES_TopTSens_95", "TopTSens_95_freeboost"]
    - ["NoPTES_TopTSens_95", "TopTSens_95_freecap"]
  scenario_triples:
    - ["NoPTES_LowSupplyTemperature_MidDH", "LowSupplyTemperature_MidDH_hpboost_nocooling", "LowSupplyTemperature_MidDH_noboost"]
    - ["NoPTES_MidSupplyTemperature_MidDH", "MidSupplyTemperature_MidDH_hpboost_nocooling", "MidSupplyTemperature_MidDH_noboost"]
    - ["NoPTES_HighSupplyTemperature_MidDH", "HighSupplyTemperature_MidDH_hpboost_nocooling", "HighSupplyTemperature_MidDH_noboost"]
  save_png: true
  save_pdf: true
  override_tech_colors:
    urban central water tanks charger: "#4a5cffc1"
    urban central water tanks discharger: "#4a5cffc1"
    urban central water tanks: "#4a5cffc1"
    urban central water pits charger: "#000F92C1"
    urban central water pits discharger: "#000F92C1"
    urban central water pits: "#000F92C1"
