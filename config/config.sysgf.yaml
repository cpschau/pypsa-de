run:
  prefix: ptes_chp_sweep
  name:
    # ===== Future 1: H2 CHP (gas plants converted to H2, forced by 2035) =====
    - H2CHP_init
    - NoPTES_H2CHP
    - PTES_H2CHP_10CAPEX
    - PTES_H2CHP_20CAPEX
    - PTES_H2CHP_40CAPEX
    - PTES_H2CHP_80CAPEX
    - PTES_H2CHP_160CAPEX

    # ===== Future 2: CH4 CHP (gas plants remain methane-fired) =====
    - CH4CHP_init
    - NoPTES_CH4CHP
    - PTES_CH4CHP_10CAPEX
    - PTES_CH4CHP_20CAPEX
    - PTES_CH4CHP_40CAPEX
    - PTES_CH4CHP_80CAPEX
    - PTES_CH4CHP_160CAPEX
  scenarios:
    enable: true
    manual_file: config/scenarios.sysgf.yaml
    file: config/scenarios.automated.yaml
  shared_resources:
    policy: base #stops recalculating
    exclude:
    - existing_heating.csv   # specify files which should not be shared between scenarios
    - costs
    - retrieve_cost   # This is necessary to save retrieve_cost_data_{year}.log in the correct folder
    - industry_sector_ratios
    - build_industry_sector_ratios   # This is necessary to save build_industry_sector_ratios_data.log in the correct folder
    - modify_existing_heating

foresight: myopic

scenario:
  ll:
  - vopt
  clusters:
  - 49 #current options: 27, 49
  opts:
  - ''
  sector_opts:
  - none
  planning_horizons:
  # - 2020
  # - 2025
  # - 2030
  # - 2035
  # - 2040
  - 2045

fix_foreign_investments:
  enable: true
  reference_scenario: H2CHP_init
  nom_min: true
  nom_max: true
  lines_only: false
  unfix_virtual_components: true
  slack: 0

clustering:
  focus_weights:
    'DE': 0.6124
    'AT': 0.0204
    'BE': 0.0204
    'CH': 0.0204
    'CZ': 0.0204
    'DK': 0.0408
    'FR': 0.0204
    'GB': 0.0408
    'LU': 0.0204
    'NL': 0.0204
    'NO': 0.0204
    'PL': 0.0204
    'SE': 0.0204
    'ES': 0.0408
    'IT': 0.0612
  temporal:
    resolution_sector: 5H

co2_budget:
  2045: 0.00

adjustments:
  electricity: false
  sector:
    absolute:
      Store:
        urban central water pits:
          standing_loss: 0.000078
        urban central water tanks:
          standing_loss: 0.000077
    factor:
      Link:
        urban central air heat pump:
          marginal_cost: 1.80
        urban central geothermal heat pump:
          capital_cost: 0.66
          marginal_cost: 2.02
        urban central river_water heat pump:
          capital_cost: 0.86
          marginal_cost: 1.80
        urban central sea_water heat pump:
          capital_cost: 0.86
          marginal_cost: 1.80
        urban central electrolysis excess heat pump:
          capital_cost: 0.76
          marginal_cost: 1.80
        urban central ptes heat pump:
          capital_cost: 0.66
          marginal_cost: 1.80

wasserstoff_kernnetz:
  enable: false

electricity:
  renewable_carriers: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, hydro]
  
sector:
  chp:
    enable: true
  district_heating:
    potential:
      DE: 0.4
      default: 0.4
    progress:
      2045: 1.0
    supply_temperature_approximation:
      max_forward_temperature_baseyear:
        FR: 110
        DK: 75
        DE: 124
        CZ: 130
        FI: 115
        PL: 130
        SE: 102
        IT: 90
      min_forward_temperature_baseyear:
        DE: 82
      return_temperature_baseyear:
        DE: 60
      lower_threshold_ambient_temperature: 0
      upper_threshold_ambient_temperature: 10
      rolling_window_ambient_temperature: 72
      relative_annual_temperature_reduction: 0.01
    subnodes:
      enable: true
      nlargest: 40
      census_areas:
        enable: true
        min_district_heating_share: 0.01
        processing:
          min_area: [10000, 100000, 0, 1000000]
          buffer_factor: [0.01, 0.05, 0.05, 0]
          buffer_absolute: 5
      limit_ptes_potential:
        enable: true
        limit_mother_nodes: true
        limit_foreign_nodes: true
        excluder_resolution: 10
        osm_landcover_codes: [21, 23, 32, 33]
        max_groundwater_depth: -10
        min_area: 25000
        default_capacity: 4500
    limited_heat_sources:
      geothermal:
        ignore_missing_regions: true
        requires_generator: true
      electrolysis excess:
        constant_temperature_celsius: 70
        ignore_missing_regions: false
        requires_generator: false
      river_water:
        constant_temperature_celsius: false
        requires_generator: true
    ptes:
      enable: true
      dynamic_capacity: false
      scale_capacity: true
      booster_technologies: ["ptes"]
      discharger_temperature_boosting_required: true
      charger_temperature_boosting_required: false
      max_top_temperature: 90
      min_bottom_temperature: 35
      clip_network_temperature: true
    ttes:
      enable: true
    ates:
      enable: false
    dh_area_buffer: 5000
  tes: true
  tes_tau:
    decentral: 3
    central: 180
  heat_pump_sources:
    urban central:
    - air
    - electrolysis excess
    - geothermal
    - river_water
    - sea_water
    - ptes
    urban decentral:
    - air
    rural:
    - air
    - ground
  electrobiofuels: true

electricity:
  H2_plants_DE:
    enable: true
    force: 2035

solving:
  runtime: 24h
  mem_mb: 180000
  constraints:
    CCL: false
    EQ: false
    BAU: false
    SAFE: false
    efuel_export_ban: false
    limits_capacity_max:
      Generator: null
      Link: null
    limits_capacity_min:
      Generator: null
      Link: null
    limits_volume_max:
      electrolysis: null
      h2_derivate_import: null
      h2_import: null      
  options:
    noisy_costs: false
    skip_iterations: true
    min_iterations: 1
    max_iterations: 1
    transmission_losses: 0
  solver_options:
    gurobi-default:
      Seed: 123
      BarConvTol: 1.e-8
      FeasibilityTol: 1.e-6
      Crossover: 0
      # NumericFocus: 3


plotting:
  # Technology grouping options (all enabled by default in plot_dh_systems.py)
  group_chp: false                   # Group all CHP technologies as "CHP"
  group_heat_pumps: false           # Group all heat pumps as "Heat Pumps"
  group_ashp_wshp: false            # Group all ASHP and WSHP technologies as "ASHP/WSHP" bypasses
  group_demands: true              # Group demands as "District Heating Demand"
  drop_losses: true
  subnodes_only: true                # Remove loss columns from plots
  aggregate_threshold_pct: 0.05
  balance_map:
    bus_carriers: null
  dual_comparison:
    enable: true
    scenario_A: NoPTES_H2CHP
    scenario_B: NoPTES_CH4CHP
  sensitivities:
    enable: false
    reference: NoPTES_H2CHP
    runs: []
  scenario_tuples:
    # H2 CHP future: NoPTES vs each CAPEX level
    - ["NoPTES_H2CHP", "PTES_H2CHP_10CAPEX"]
    - ["NoPTES_H2CHP", "PTES_H2CHP_20CAPEX"]
    - ["NoPTES_H2CHP", "PTES_H2CHP_40CAPEX"]
    - ["NoPTES_H2CHP", "PTES_H2CHP_80CAPEX"]
    - ["NoPTES_H2CHP", "PTES_H2CHP_160CAPEX"]
    # CH4 CHP future: NoPTES vs each CAPEX level
    - ["NoPTES_CH4CHP", "PTES_CH4CHP_10CAPEX"]
    - ["NoPTES_CH4CHP", "PTES_CH4CHP_20CAPEX"]
    - ["NoPTES_CH4CHP", "PTES_CH4CHP_40CAPEX"]
    - ["NoPTES_CH4CHP", "PTES_CH4CHP_80CAPEX"]
    - ["NoPTES_CH4CHP", "PTES_CH4CHP_160CAPEX"]
  scenario_triples: []
  save_png: true
  save_pdf: true
  override_tech_colors:
    urban central water tanks charger: "#4a5cffc1"
    urban central water tanks discharger: "#4a5cffc1"
    urban central water tanks: "#4a5cffc1"
    urban central water pits charger: "#000F92C1"
    urban central water pits discharger: "#000F92C1"
    urban central water pits: "#000F92C1"
    urban central water tanks load: "#4a5cffc1"
    urban central water tanks generation: "#4a5cffc1"
    urban central water pits load: "#000F92C1"
    urban central water pits generation: "#000F92C1"
    urban central solid biomass CHP: "forestgreen"
    urban central solid biomass CHP CC: "palegreen"
    urban central lignite CHP: "grey"
    urban central coal CHP: "dimgrey"
    urban central oil CHP: "darkolivegreen"
    urban central H2 CHP: "purple"
    urban central geothermal heat direct utilisation: "olive"
    urban central geothermal heat pump: "khaki"
    urban central heat vent: "red"
    urban central resistive heater: "#28DBA6"
    urban central air heat pump: "#00FF0D"
    urban central river_water heat pump: "#FF9A03"
    urban central sea_water heat pump: "#E27C00"
    low-temperature heat for industry: "#929292"
    waste CHP: "plum"
    Fischer-Tropsch: "slateblue"
    urban central water tanks losses: "mediumspringgreen"
    urban central water pits losses: "mediumseagreen"
    other technologies: "dimgrey"
    neighbour countries: "gainsboro"
    EU aggregated: "gainsboro"
    CHP: "brown"
    PV: "#FFFD6A"
    wind power: "#83D8FF"
    H2 OCGT: "#8A2BE2"
    decentral heat pump: "#556B2F"
    power grid: "#228B22"
    transmission grid: "#228B22"
    decentral biomass boiler: "#007910"
    urban central heat: "#CCCCCC"
    biomass to liquid CC: "#B0FF90"
    Heat demand: "lightgrey"
    Heat pumps: "#FFC13C"
    urban central electrolysis excess heat pump: "magenta"
    electrolysis excess heat pump: "magenta"
