# =============================================================================
# PTES CAPEX Sensitivity Scenarios
# 6 setups × (init + NoPTES + 5 CAPEX levels) = 42 scenarios
#
# CAPEX factors (relative to base 68 €/m³):
#   10 €/m³ → 0.147    20 €/m³ → 0.294    40 €/m³ → 0.588
#   80 €/m³ → 1.176   160 €/m³ → 2.353
#
# Setups:
#   1. Base          — Baseline (DH 0.6, 1%/a temp reduction)
#   2. H2Late        — H2 plants forced 2050 instead of 2035
#   3. H2Late2Ely    — H2 plants 2050 + 2× Electrolyzer CAPEX
#   4. ProgDH        — Progressive DH (0.6, 2%/a temp reduction)
#   5. ConsDH        — Conservative DH (0.2, 0.5%/a temp reduction)
#   6. RelaxCO2      — Relaxed CO2 budget (0.20 in 2045)
# =============================================================================


# =============================================================================
# Setup 1: Base — Baseline assumptions (DH 0.6, 1%/a temp reduction)
# =============================================================================

Base_init:
  fix_foreign_investments:
    enable: false
  sector:
    district_heating:
      potential:
        DE: 0.6
      ptes:
        booster_technologies: ["resistive heater"]
      supply_temperature_approximation:
        relative_annual_temperature_reduction: 0.01
  adjustments:
    electricity: false
    sector:
      absolute:
        Store:
          urban central water pits:
            e_nom_max: 0
  solving:
    options:
      skip_iterations: false

NoPTES_Base:
  fix_foreign_investments:
    enable: true
    lines_only: true
