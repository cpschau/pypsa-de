# =============================================================================
# PTES + CHP Future Scenarios (Sepulveda-style LDES analysis)
# 2 CHP futures × (init + NoPTES + 5 CAPEX levels) = 14 scenarios
#
# CAPEX factors (relative to base 68 €/m³):
#   10 €/m³ → 0.147    20 €/m³ → 0.294    40 €/m³ → 0.588
#   80 €/m³ → 1.176   160 €/m³ → 2.353
#
# Futures:
#   1. H2CHP   — H2 plants enabled, forced by 2035 (default)
#   2. CH4CHP  — H2 plants disabled, gas CHPs remain methane-fired
# =============================================================================


# =============================================================================
# Future 1: H2 CHP — Gas turbines & CHPs converted to H2 by 2035
# =============================================================================

H2CHP_init:
  fix_foreign_investments:
    enable: false
  sector:
    district_heating:
      potential:
        DE: 0.6
      ptes:
        booster_technologies: ["resistive heater"]
      supply_temperature_approximation:
        relative_annual_temperature_reduction: 0.01
  adjustments:
    electricity: false
    sector:
      absolute:
        Store:
          urban central water pits:
            e_nom_max: 0
  solving:
    options:
      skip_iterations: false

NoPTES_H2CHP:
  fix_foreign_investments:
    enable: true
    lines_only: true
    reference_scenario: H2CHP_init
  sector:
