# Mid Supply Temperature scenarios with Mid DH (0.4)
NoPTES_MidSupplyTemperature_MidDH_init:
  fix_foreign_investments:
    enable: false
  sector:
    district_heating:
      potential:
        DE: 0.4
      supply_temperature_approximation:
        relative_annual_temperature_reduction: 0.005
  adjustments:
    electricity: false
    sector:
      absolute:
        Store:
          urban central water pits:
            e_nom_max: 0
      factor:
        Store:
          urban central water tanks:
            capital_cost: 1.05
  solving:
    options:
      skip_iterations: false

